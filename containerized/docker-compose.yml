# Gas City — clean containerized stack.
#
# Single service. Everything you need to run gascity in Docker, with the
# host's SSH keys and AWS credentials staying out of reach. No gastown
# legacy and no sidecars.
#
# Usage:
#   cp .env.example .env
#   # edit .env to set GIT_USER / GIT_EMAIL
#   docker compose up -d
#   docker compose exec gascity bash
#   # inside:
#   gc cities
#   gc doctor
#   gc rig add /city/rigs-host/<your-repo>

name: gascity

services:
  gascity:
    image: gascity:${GASCITY_IMAGE_TAG:-latest}
    container_name: gascity
    hostname: gascity

    build:
      context: .
      dockerfile: Dockerfile
      args:
        GASCITY_REPO: ${GASCITY_REPO:-https://github.com/gastownhall/gascity.git}
        GASCITY_REF:  ${GASCITY_REF:-main}

    stdin_open: true
    tty: true

    # --- Security ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    # --- Resource caps (prevent fork bombs / runaway agents) ---
    deploy:
      resources:
        limits:
          cpus:   '4'
          memory: 4G
          pids:   512

    environment:
      IS_SANDBOX: 1
      GIT_USER:   ${GIT_USER:-TestUser}
      GIT_EMAIL:  ${GIT_EMAIL:-test@example.com}
      # Coding-agent runtime registered into the city. See `gc init --help`.
      GC_PROVIDER: ${GC_PROVIDER:-claude-code}

    volumes:
      # Workspace root where the city is initialized (persistent volume).
      - city-workspace:/city

      # Dolt data on its own Docker volume — avoids VirtioFS journal
      # corruption that hits when dolt fsync's against a macOS bind mount.
      - dolt-data:/city/.dolt-data

      # Code directory mounted read-write at /city/rigs-host. Agents add
      # rigs out of subdirectories here. SSH keys, AWS creds, and other
      # host configs are deliberately not mounted.
      - ${GCC_CODE_DIR:-~/code}:/city/rigs-host:rw

      # Host Claude config: read-only staging that the entrypoint copies
      # into the writable home volume below. Lets you inherit your Max
      # subscription / OAuth without re-logging in inside the container.
      - ~/.claude:/home/agent/.claude-host:ro

      # Host gh CLI: same pattern, lets agents `git push` to your repos.
      - ~/.config/gh:/home/agent/.config/gh-host:ro

      # Writable Claude home (credentials, sessions, history).
      - claude-data:/home/agent/.claude

      # Claude Code runtime state — onboarding completion, locks, version
      # bookkeeping. Without these, the theme picker pops every restart.
      - claude-state:/home/agent/.local/state/claude
      - claude-share:/home/agent/.local/share/claude

    networks:
      - gc-net

    restart: unless-stopped

networks:
  gc-net:
    driver: bridge

volumes:
  city-workspace:
  dolt-data:
  claude-data:
  claude-state:
  claude-share:
